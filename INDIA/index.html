<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>India Tourism Explorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🇮🇳 India Tourism Explorer</h1>

    <div class="search-box">
        <input type="text" id="placeInput" placeholder="Search Tourist Place...">
        <button onclick="searchPlace()">Search</button>
    </div>
</header>

<section id="placeDetails"></section>

<section>
    <h2>🏨 Stay Options</h2>
    <div id="hotels" class="cards"></div>
</section>

<section>
    <h2>🍽 Restaurants</h2>
    <div id="restaurants" class="cards"></div>
</section>

<section>
    <h2>📸 Nearby Attractions</h2>
    <div id="attractions" class="cards"></div>
</section>

<script src="app.js"></script>
</body>
</html>
